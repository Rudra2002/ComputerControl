<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC Control Dashboard</title>
    <link rel="stylesheet" href="/dashboard.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💻</text></svg>">
</head>
<body>
    <div class="container">
        <div class="dashboard">
            <div class="circle-1"></div>
            <div class="circle-2"></div>
            <div class="circle-3"></div>
            
            <div class="header">
                <h1>PC Control Dashboard</h1>
                <div class="status-indicator">
                    <div class="status-dot" id="statusDot"></div>
                    <span id="statusText">Checking...</span>
                </div>
            </div>
            
            <div class="controls">
                <button class="control-btn power-btn" id="powerBtn" onclick="powerOn()">
                    <div class="btn-icon">⚡</div>
                    <span>Power On</span>
                    <div class="btn-ripple"></div>
                </button>
                
                <button class="control-btn restart-btn" id="restartBtn" onclick="restart()">
                    <div class="btn-icon">🔄</div>
                    <span>Restart</span>
                    <div class="btn-ripple"></div>
                </button>
            </div>
            
            <div class="info-panel">
                <div class="info-item">
                    <span class="info-label">IP Address:</span>
                    <span class="info-value" id="ipAddress">%IP_ADDRESS%</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Uptime:</span>
                    <span class="info-value" id="uptime">0s</span>
                </div>
                <div class="info-item">
                    <span class="info-label">WiFi Signal:</span>
                    <span class="info-value" id="wifiSignal">-</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Last Update:</span>
                    <span class="info-value" id="lastUpdate">-</span>
                </div>
            </div>
            
            <div class="footer">
                <p>ESP8266 PC Controller v1.0</p>
                <button id="logoutBtn" class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </div>
    </div>
    
    <script src="/dashboard.js"></script>
</body>
</html>
